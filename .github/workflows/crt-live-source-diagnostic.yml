name: CRT Live Source Gate Diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/crt-live-source-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement requirements.txt
      - name: Diagnose registered futures endpoint availability
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          paths = [
              "/fapi/v1/openInterest?symbol=BTCUSDT",
              "/fapi/v1/fundingRate?symbol=BTCUSDT&limit=9",
              "/futures/data/openInterestHist?symbol=BTCUSDT&period=5m&limit=1",
          ]
          for path in paths:
              url = "https://fapi.binance.com" + path
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.load(response)
                      print(path, response.status, type(data).__name__)
              except urllib.error.HTTPError as exc:
                  print(path, "HTTP", exc.code, exc.read(512).decode("utf-8", "replace"))
              except (OSError, ValueError) as exc:
                  print(path, type(exc).__name__, str(exc))
          PY
      - name: Collect Coinbase completed weekly diagnostic
        run: |
          mkdir -p diagnostic
          python scripts/weekly_btc_diagnostic.py > diagnostic/weekly-btc.json
          cat diagnostic/weekly-btc.json
        continue-on-error: true
      - name: Capture locked ETF flow source
        env:
          PYTHONPATH: src
        run: |
          mkdir -p diagnostic
          python -m crt_radar.btc_etf_intake --capture diagnostic/etf-raw.json > diagnostic/etf-normalized.json
          cat diagnostic/etf-normalized.json
        continue-on-error: true
      - name: Test registered liquidation collector
        env:
          PYTHONPATH: src
        run: |
          mkdir -p diagnostic
          python -m crt_radar.liquidation_collector collect --runtime-root diagnostic/liquidation --max-runtime-s 75
          python -m json.tool diagnostic/liquidation/snapshots/latest.json > /dev/null
          mkdir -p runtime/snapshots
          cp diagnostic/liquidation/snapshots/latest.json runtime/snapshots/latest.json
        continue-on-error: true
      - name: Collect source gate evidence
        env:
          PYTHONPATH: src
        run: |
          mkdir -p diagnostic
          python -m crt_radar.source_gate_runner > diagnostic/source-gate.json
          python -m json.tool diagnostic/source-gate.json > /dev/null
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crt-live-source-gate
          path: |
            radar/diagnostic/etf-raw.json
            radar/diagnostic/etf-normalized.json
            radar/diagnostic/weekly-btc.json
            radar/diagnostic/source-gate.json
            radar/diagnostic/liquidation/snapshots/latest.json
          if-no-files-found: error
          retention-days: 3
      - name: Report source-level diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("diagnostic/source-gate.json")
          if p.exists():
              d = json.loads(p.read_text())
              for key in ("formal_state", "blocked_reasons", "l6_candidate_state", "l6_candidate_blocked_reasons"):
                  print(key, d.get(key))
              for item in d.get("evidence", []):
                  print("QUALITY", {k: item.get(k) for k in ("input_family", "source_id", "quality_state", "quality_error", "as_of_ms", "error")})
              for family, value in d.get("parsed", {}).items():
                  print(family, json.dumps(value, ensure_ascii=False)[:2000])
          PY
      - name: Reject blocked source gate
        run: |
          python -c 'import json; d=json.load(open("diagnostic/source-gate.json")); print(d.get("formal_state"), d.get("blocked_reasons")); assert d.get("formal_state") == "OBSERVATION_ONLY"'
